[package]
name = "tree-sitter-python"
version = "0.25.0-dependency.1"
edition = "2021"
license = "MIT"
description = "Vendored tree-sitter-python 0.25.0 with focused PEP 696 declaration grammar"
repository = "https://github.com/tree-sitter/tree-sitter-python"
build = "bindings/rust/build.rs"

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
cc = "1.2"

[dev-dependencies]
tree-sitter = "0.25"
